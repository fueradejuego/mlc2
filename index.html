            else if (forceOS === 'pc') { isAndroid = false; isIOS = false; }

            if (!isAndroid && !isIOS) {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(url).then(() => {
                        document.getElementById('status-text').innerHTML = "ENLACE COPIADO AL PORTAPAPELES 📋<br><br>ABRE VLC MEDIA PLAYER Y PULSA CTRL+V";

                } else {

                    try { document.execCommand("copy"); document.getElementById('status-text').innerHTML = "ENLACE COPIADO AL PORTAPAPELES 📋<br><br>ABRE VLC MEDIA PLAYER Y PULSA CTRL+N (O CTRL+V)"; } 
                    catch (err) { document.getElementById('status-text').innerHTML = `COPIA ESTE ENLACE Y PÉGALO EN VLC:<br><br><span style="color:#1ed760; user-select:all;">${url}</span>`; }
                    document.body.removeChild(tempInput);
                }
                return; 
            }

            document.getElementById('status-text').innerText = "ESPERANDO CONFIRMACIÓN DEL NAVEGADOR PARA ABRIR VLC...";
            let vlcUrl = '';
            if (isAndroid) {
                let cleanUrl = url.replace(/^https?:\/\//i, '');
                let scheme = url.startsWith('https') ? 'https' : 'http';
                vlcUrl = `intent://${cleanUrl}#Intent;package=org.videolan.vlc;scheme=${scheme};type=video/*;end`;
            } else { vlcUrl = `vlc://${url}`; }

            if (!btnElement.parentNode.classList.contains('vlc-wrapper')) {
                const wrapper = document.createElement('a');

                    setTimeout(() => {
                        if (wrapper.parentNode) { wrapper.parentNode.insertBefore(btnElement, wrapper); wrapper.parentNode.removeChild(wrapper); }
                    }, 100);
                });
            }
        }

        // ================= PARCHEO SHAKA PLAYER =================
        function applyShakaMonkeyPatch() {
            if (window.shaka && !window.shaka_patched) {
                const originalLoad = shaka.Player.prototype.load;
                
                shaka.Player.prototype.load = function() {
                    const net = this.getNetworkingEngine();
                    if (net) {
                        net.clearAllRequestFilters(); net.clearAllResponseFilters(); 

                        net.registerRequestFilter((type, request) => {
                            const typesToRewrite = [
                                shaka.net.NetworkingEngine.RequestType.MANIFEST,
                                shaka.net.NetworkingEngine.RequestType.SEGMENT,
                                shaka.net.NetworkingEngine.RequestType.LICENSE
                            ];

                            if (typesToRewrite.includes(type) && request.uris && request.uris.length) {
                                request.uris = request.uris.map((uri) => {
                                    if (uri.startsWith('data:') || uri.startsWith('blob:')) return uri;
                                    let finalUri = uri;
                                    if (finalUri.startsWith('http://')) finalUri = finalUri.replace(/^http:\/\//i, 'https://');

                                    if (dynamicTokenParams && finalUri.startsWith('http')) {
                                        try {
                                            let urlObj = new URL(finalUri); let newParams = new URLSearchParams(dynamicTokenParams);
                                            newParams.forEach((val, key) => { urlObj.searchParams.set(key, val); });
                                            finalUri = urlObj.toString();
                                        } catch(e) {}
                                    }

                                    const isManifestOrSegment = (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT);
                                    if (isManifestOrSegment && currentProxyUrl && !finalUri.startsWith(currentProxyUrl)) { finalUri = currentProxyUrl + finalUri; }
                                    return finalUri;
                                });
                            }
                        });

                        net.registerResponseFilter((type, response) => {
                            if (type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                                if (response.uri && response.headers) {
                                    const uriLower = response.uri.toLowerCase();
                                    if (uriLower.includes('.dash')) {
                                        let contentTypeKey = Object.keys(response.headers).find(k => k.toLowerCase() === 'content-type');
                                        if (!contentTypeKey) contentTypeKey = 'content-type';
                                        
                                        if (uriLower.includes('audio') || uriLower.includes('aud=')) { response.headers[contentTypeKey] = 'audio/mp4'; } 
                                        else if (uriLower.includes('video') || uriLower.includes('vid=')) { response.headers[contentTypeKey] = 'video/mp4'; }
                                    }
                                }
                            }
                            if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST && response.data) {
                                let manifestText = new TextDecoder().decode(response.data);
                                manifestText = manifestText.replace(/<AdaptationSet[^>]*codecs="ec-3"[\s\S]*?<\/AdaptationSet>/g, '');
                                manifestText = manifestText.replace(/scte214:supplementalCodecs="[^"]*"/g, '');
                                manifestText = manifestText.replace(/scte214:supplementalProfiles="[^"]*"/g, '');
                                manifestText = manifestText.replace(/xmlns:scte214="[^"]*"/g, '');
                                response.data = new TextEncoder().encode(manifestText);
                            }
                        });
                    }
                    return originalLoad.apply(this, arguments);
                };
                window.shaka_patched = true;
            }
        }

                    if (video.seekable && video.seekable.length > 0) {
                        const liveEdge = video.seekable.end(video.seekable.length - 1);
                        video.currentTime = Math.max(0, liveEdge - 2); 
                    }
                    const p = video.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } catch (e) {}
            }, 1500); 
        }

        function createOPlayer(sourceUrl, type, clearKeys = null) {
            destroyOPlayer(); const isMobile = window.innerWidth <= 600;
            const plugins = [ OUI({ theme: { primaryColor: '#e50914' }, pictureInPicture: !isMobile, screenshot: !isMobile, settings: ['loop'], keyboard: { global: true } }), new OPlugin.Chromecast() ];
            const needsShaka = (type === 'dash') || (clearKeys) || (currentProxyUrl !== '') || (dynamicTokenParams !== '');

            if (needsShaka) {
                const shakaConfig = { config: {} };
                shakaConfig.config.manifest = { dash: { ignoreEmptyAdaptationSet: true } };
                shakaConfig.config.preferredAudioChannelCount = 2; shakaConfig.config.preferredVideoCodecs = ['avc1', 'hev1', 'hvc1'];
                if (clearKeys) { shakaConfig.config.drm = { clearKeys: clearKeys }; }
                plugins.push(OShaka(shakaConfig));
            } else if (type === 'hls') {
                plugins.push(OHls({ library: 'https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js' }));
            }
            try {
                playerInstance = OPlayer.make('#oplayer', { source: { src: sourceUrl }, autoplay: true, isLive: true }).use(plugins).create();
                jumpToLiveEdge();
            } catch (e) { console.error('Error load:', e); }
        }

        // ================= LÓGICA SHAKA NATIVO Y UI CUSTOM =================
        function resetShakaInactivity() {
            const wrapper = document.getElementById('shaka-container');
            wrapper.classList.remove('idle'); clearTimeout(shakaInactivityTimer);
            const video = document.getElementById('shaka-video');
            if (video && !video.paused) { shakaInactivityTimer = setTimeout(() => { wrapper.classList.add('idle'); }, 3000); }
        }
        
        function updateShakaMenu() {
            if (!shakaNativePlayer) return;

            const tabQuality = document.getElementById('tab-quality');
            const tabAudio = document.getElementById('tab-audio');
            const tabSubs = document.getElementById('tab-subs');

            tabQuality.innerHTML = ''; tabAudio.innerHTML = ''; tabSubs.innerHTML = '';

            const tracks = shakaNativePlayer.getVariantTracks();
            const textTracks = shakaNativePlayer.getTextTracks();
            const videoTracks = tracks.filter(t => t.type === 'variant' && t.height && t.bandwidth);
            const uniqueVariants = []; const seen = new Set();
            
            videoTracks.forEach(t => {
                const key = t.height + '_' + t.bandwidth;
                if (!seen.has(key)) { seen.add(key); uniqueVariants.push(t); }
            });

            uniqueVariants.sort((a, b) => { if (b.height !== a.height) return b.height - a.height; return b.bandwidth - a.bandwidth; });
            const isAbrEnabled = shakaNativePlayer.getConfiguration().abr.enabled;
            
            const autoBtn = document.createElement('div'); autoBtn.className = `custom-shaka-menu-item ${isAbrEnabled ? 'selected' : ''}`;
            autoBtn.innerText = 'Automático'; autoBtn.onclick = () => { shakaNativePlayer.configure({ abr: { enabled: true } }); updateShakaMenu(); };
            tabQuality.appendChild(autoBtn);

            uniqueVariants.forEach(track => {
                const activeTrack = videoTracks.find(t => t.active);
                const isSelected = !isAbrEnabled && activeTrack && activeTrack.height === track.height && activeTrack.bandwidth === track.bandwidth;
                const trackBtn = document.createElement('div'); trackBtn.className = `custom-shaka-menu-item ${isSelected ? 'selected' : ''}`;
                
                let bitrateText = '';
                if (track.bandwidth >= 1000000) { bitrateText = (track.bandwidth / 1000000).toFixed(1) + ' Mbps'; }
                else { bitrateText = Math.round(track.bandwidth / 1000) + ' kbps'; }

                trackBtn.innerText = `${track.height}p (${bitrateText})`;
                trackBtn.onclick = () => { shakaNativePlayer.configure({ abr: { enabled: false } }); shakaNativePlayer.selectVariantTrack(track, true); updateShakaMenu(); };
                tabQuality.appendChild(trackBtn);
            });

            const audioGroups = [...new Set(tracks.map(t => t.language))].filter(l => l);
            if(audioGroups.length === 0) { tabAudio.innerHTML = '<div class="custom-shaka-menu-item selected">Audio original</div>'; } 
            else {
                audioGroups.forEach(lang => {
                    const activeTrack = tracks.find(t => t.active); const isSelected = activeTrack && activeTrack.language === lang;
                    const audioBtn = document.createElement('div'); audioBtn.className = `custom-shaka-menu-item ${isSelected ? 'selected' : ''}`;
                    const displayName = new Intl.DisplayNames(['es'], {type: 'language'}).of(lang) || lang;
                    audioBtn.innerText = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                    audioBtn.onclick = () => { shakaNativePlayer.selectAudioLanguage(lang); updateShakaMenu(); };
                    tabAudio.appendChild(audioBtn);
                });
            }

            const subsOffBtn = document.createElement('div'); subsOffBtn.className = `custom-shaka-menu-item ${!shakaNativePlayer.isTextTrackVisible() ? 'selected' : ''}`;
            subsOffBtn.innerText = 'Desactivado'; subsOffBtn.onclick = () => { shakaNativePlayer.setTextTrackVisibility(false); updateShakaMenu(); };
            tabSubs.appendChild(subsOffBtn);

            textTracks.forEach(track => {
                const isSelected = track.active && shakaNativePlayer.isTextTrackVisible();
                const subBtn = document.createElement('div'); subBtn.className = `custom-shaka-menu-item ${isSelected ? 'selected' : ''}`;
                const displayName = new Intl.DisplayNames(['es'], {type: 'language'}).of(track.language) || track.language;
                subBtn.innerText = displayName.charAt(0).toUpperCase() + displayName.slice(1);
                subBtn.onclick = () => { shakaNativePlayer.selectTextTrack(track); shakaNativePlayer.setTextTrackVisibility(true); updateShakaMenu(); };
                tabSubs.appendChild(subBtn);
            });
        }
        
        function initCustomShakaEvents() {
            const video = document.getElementById('shaka-video');
            const wrapper = document.getElementById('shaka-container');
            const playBtn = document.getElementById('shaka-play-btn');
            const centerPlayBtn = document.getElementById('shaka-center-play');
            
            // Volume Menu
            const volMenuBtn = document.getElementById('shaka-volume-menu-btn');
            const volMenu = document.getElementById('shaka-volume-menu');
            const muteBtn = document.getElementById('shaka-mute-btn');
            const volSlider = document.getElementById('shaka-vol-slider');
            
            // Settings Menu
            const settingsBtn = document.getElementById('shaka-settings-btn');
            const settingsMenu = document.getElementById('shaka-settings-menu');
            
            const fullscreenBtn = document.getElementById('shaka-fullscreen-btn');
            const pipBtn = document.getElementById('shaka-pip-btn');
            const castBtn = document.getElementById('shaka-cast-btn');
            const seekPlayed = document.getElementById('shaka-seek-played');
            const seekBuffer = document.getElementById('shaka-seek-buffer');
            const seekbar = document.getElementById('shaka-seekbar');
            const liveBtn = document.getElementById('shaka-live-btn');
            const menuTabs = document.querySelectorAll('.custom-shaka-menu-tab');
            const menuPanels = document.querySelectorAll('.custom-shaka-menu-panel');

            wrapper.addEventListener('mousemove', resetShakaInactivity);
            wrapper.addEventListener('touchstart', resetShakaInactivity);
            wrapper.addEventListener('click', resetShakaInactivity);

            const togglePlay = () => { if (video.paused) video.play(); else video.pause(); };
            playBtn.addEventListener('click', togglePlay);
            centerPlayBtn.addEventListener('click', togglePlay);

            video.addEventListener('play', () => {
                playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                wrapper.classList.remove('paused'); resetShakaInactivity();
            });

            video.addEventListener('pause', () => {
                playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                wrapper.classList.add('paused'); wrapper.classList.remove('idle'); clearTimeout(shakaInactivityTimer);
            });

            // GESTIÓN DE MENÚS (AJUSTES Y VOLUMEN)
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                settingsMenu.classList.toggle('show');
                volMenu.classList.remove('show');
                if(settingsMenu.classList.contains('show')) updateShakaMenu();
            });

            volMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                volMenu.classList.toggle('show');
                settingsMenu.classList.remove('show');
            });

            document.addEventListener('click', (e) => {
                if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) settingsMenu.classList.remove('show');
                if (!volMenuBtn.contains(e.target) && !volMenu.contains(e.target)) volMenu.classList.remove('show');
            });

            // GESTIÓN DE VOLUMEN
            volSlider.addEventListener('input', (e) => { video.volume = e.target.value; video.muted = (e.target.value == 0); });
            muteBtn.addEventListener('click', () => { video.muted = !video.muted; });

            video.addEventListener('volumechange', () => {
                volSlider.value = video.volume;
                let iconClass = 'bi-volume-up-fill';
                if (video.muted || video.volume === 0) iconClass = 'bi-volume-mute-fill';
                else if (video.volume < 0.5) iconClass = 'bi-volume-down-fill';
                
                muteBtn.innerHTML = `<i class="bi ${iconClass}"></i>`;
                volMenuBtn.innerHTML = `<i class="bi ${iconClass}"></i>`;
            });

            menuTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuTabs.forEach(t => t.classList.remove('active')); menuPanels.forEach(p => p.classList.remove('active'));
                    tab.classList.add('active'); document.getElementById(tab.dataset.target).classList.add('active');
                });
            });

            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen().catch(err => console.error(err));
                else document.exitFullscreen();
            });

            if (!document.pictureInPictureEnabled) { pipBtn.style.display = 'none'; } 
            else {
                pipBtn.addEventListener('click', async () => {
                    try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } 
                    catch (err) { console.error("Error PiP:", err); }
                });
                video.addEventListener('enterpictureinpicture', () => pipBtn.style.color = 'var(--accent)');
                video.addEventListener('leavepictureinpicture', () => pipBtn.style.color = '#fff');
            }

            const updateCastBtn = () => {
                if (shakaNativeCastProxy && shakaNativeCastProxy.canCast()) {
                    castBtn.style.display = 'inline-flex'; castBtn.style.color = shakaNativeCastProxy.isCasting() ? 'var(--accent)' : '#fff';
                } else { castBtn.style.display = 'none'; }
            };
            if (shakaNativeCastProxy) {
                shakaNativeCastProxy.addEventListener('caststatuschanged', updateCastBtn); updateCastBtn(); 
                castBtn.addEventListener('click', () => {
                    if (shakaNativeCastProxy.isCasting()) shakaNativeCastProxy.suggestDisconnect();
                    else shakaNativeCastProxy.cast().catch(e => console.error("Error Cast:", e));
                });
            }

            // GESTIÓN DE LA BARRA DE TIEMPO CLICKABLE
            seekbar.addEventListener('click', (e) => {
                if (!shakaNativePlayer) return;
                const rect = seekbar.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                const isLive = shakaNativePlayer.isLive();

                if (isLive) {
                    const range = shakaNativePlayer.seekRange();
                    video.currentTime = range.start + (pos * (range.end - range.start));
                } else if (video.duration) {
                    video.currentTime = pos * video.duration;
                }
            });

            // GESTIÓN DEL BOTÓN LIVE AL HACER CLIC
            liveBtn.addEventListener('click', () => {
                if (shakaNativePlayer && shakaNativePlayer.isLive()) {
                    const range = shakaNativePlayer.seekRange();
                    video.currentTime = range.end;
                    video.play();
                }
            });

            // ACTUALIZACIÓN DE BARRA Y ESTADO DEL BOTÓN LIVE
            video.addEventListener('timeupdate', () => {
                if (!shakaNativePlayer) return;
                const isLive = shakaNativePlayer.isLive();
                let percentage = 0; let bufferPercentage = 0;

                if (isLive) {
                    liveBtn.style.display = 'flex'; // Mostramos si es directo
                    const range = shakaNativePlayer.seekRange();
                    const duration = range.end - range.start;
                    
                    if (duration > 0) {
                        percentage = ((video.currentTime - range.start) / duration) * 100;
                        if (video.buffered.length > 0) {
                            const bufferEnd = video.buffered.end(video.buffered.length - 1);
                            bufferPercentage = ((bufferEnd - range.start) / duration) * 100;
                        }
                    }
                    
                    // Comprobar si estamos al borde del directo (margen de 4 segundos de retraso)
                    if (Math.abs(range.end - video.currentTime) <= 4) {
                        liveBtn.classList.add('at-live');
                    } else {
                        liveBtn.classList.remove('at-live');
                    }
                } else {
                    liveBtn.style.display = 'none'; // Ocultamos en VOD/Películas
                    if (video.duration) {
                        percentage = (video.currentTime / video.duration) * 100;
                        if (video.buffered.length > 0) bufferPercentage = (video.buffered.end(video.buffered.length - 1) / video.duration) * 100;
                    }
                }

                seekPlayed.style.width = Math.min(Math.max(percentage, 0), 100) + '%';
                seekBuffer.style.width = Math.min(Math.max(bufferPercentage, 0), 100) + '%';
            });
        }

        function unloadShakaNative() {
            if (shakaNativeCastProxy && shakaNativeCastProxy.isCasting()) shakaNativeCastProxy.suggestDisconnect();
            if (shakaNativePlayer) try { shakaNativePlayer.unload(); } catch(e){}
        }

        async function runShakaNative(manifestUri, clearKeys) {
            const video = document.getElementById('shaka-video');
            if (!isShakaNativeInitialized) {
                shakaNativePlayer = new shaka.Player(video);
                shakaNativeCastProxy = new shaka.cast.CastProxy(video, shakaNativePlayer, RECEIVER_ID);
                if (shakaNativeUI) shakaNativeUI.destroy();
                initCustomShakaEvents(); isShakaNativeInitialized = true;
                shakaNativePlayer.addEventListener('variantchanged', updateShakaMenu);
                shakaNativePlayer.addEventListener('trackschanged', updateShakaMenu);
                shakaNativePlayer.addEventListener('adaptation', updateShakaMenu);
            }

            const activePlayer = shakaNativeCastProxy.getPlayer();
            const playerConfig = { abr: { enabled: true }, manifest: { dash: { ignoreEmptyAdaptationSet: true } }, preferredAudioChannelCount: 2, preferredVideoCodecs: ['avc1', 'hev1', 'hvc1'] };
            if (clearKeys) playerConfig.drm = { clearKeys: clearKeys };
            if (currentProxyUrl !== '') playerConfig.streaming = playerConfig.streaming || {};
            
            activePlayer.configure(playerConfig);

            try {
                if (currentProxyUrl !== '') await activePlayer.load(manifestUri, Infinity);
                else {
                    await activePlayer.load(manifestUri);
                    if (activePlayer.isLive()) {
                        const range = activePlayer.seekRange();
                        if (range && isFinite(range.end)) video.currentTime = Math.max(range.start, range.end - 0);
                    }
                }
                updateShakaMenu(); video.play();
            } catch (e) { console.error("Error Shaka:", e); }
        }

        // ================= ANTI-DEVTOOLS =================
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => { if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67))) return false; };
        setInterval(() => { let s = Date.now(); debugger; if (Date.now() - s > 100) window.location.replace("https://www.google.com"); }, 500);

    </script>
